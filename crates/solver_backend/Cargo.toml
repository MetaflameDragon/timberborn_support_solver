[package]
name = "solver-backend"
version = "0.1.0"
edition = "2024"

[lib]

[features]
backend_rustsat_tokio = ["dep:futures-channel", "dep:tokio", "dep:rustsat"]

[dependencies]
timberborn-platform-cruncher = { path = "../../." }

log = "0.4.27"
anyhow = "1.0.99"
serde = { version = "1.0.219", features = ["derive"] }

futures-channel = { version = "0.3.31", optional = true }
tokio = { version = "1.47.1", optional = true }
rustsat = { version = "0.7.3", features = ["serde"], optional = true }
rustsat-glucose = { version = "0.7.3", optional = true }
