[package]
name = "timberborn-platform-cruncher-repl"
version = "0.1.0"
edition = "2024"

[dependencies]
timberborn-platform-cruncher = { path = "../../." }
solver-backend = { path = "../solver_backend", features = ["backend_rustsat_tokio", "rustsat-glucose"] }

log = "0.4.27"
env_logger = "0.11.8"
anyhow = "1.0.99"
clap = { version = "4.5.39", features = ["cargo", "derive"] }
shlex = "1.3.0"
thiserror = { version = "2.0.12" }
owo-colors = "4.2.2"
rustsat-glucose = { version = "0.7.2", features = [] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "rt", "macros", "signal"] }
tokio-util = "0.7.16"
toml = "0.9.4"
